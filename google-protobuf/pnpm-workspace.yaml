# Not a workspace root — this file only carries pnpm settings for this
# benchmark directory. Each directory installs independently so the four
# dependency trees stay isolated from one another.

allowBuilds:
  # Postinstall fetches the protoc binary + plugins that gen_grpc.sh runs.
  grpc-tools: true
  protobufjs: true
  # Transitive dev dep of clinic; its postinstall only prints a funding notice.
  es5-ext: false
